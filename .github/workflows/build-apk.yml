name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Information ==="
          java -version
          echo "=== JAVA_HOME Path ==="
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ] || [ ! -d "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not properly set or directory does not exist." >&2
            exit 1
          fi

          # Detect active Java major version
          RAW_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Raw Java version string: $RAW_VERSION"

          if [ -z "$RAW_VERSION" ]; then
            echo "ERROR: Unable to detect Java version from output." >&2
            exit 1
          fi

          JAVA_MAJOR=$(echo "$RAW_VERSION" | awk -F '.' '{print ($1 == "1" ? $2 : $1)}')
          echo "Detected Java major version: $JAVA_MAJOR"

          if [ -z "$JAVA_MAJOR" ] || ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Could not parse Java major version as an integer." >&2
            exit 1
          fi

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java major version ($JAVA_MAJOR) is lower than required (17)." >&2
            exit 1
          fi

          echo "Java environment verified successfully: Java $JAVA_MAJOR >= 17."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists. Reusing existing file."
          else
            echo "Generating temporary debug keystore with keytool..."
            "$JAVA_HOME/bin/keytool" -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to verify that ./debug.keystore exists after generation." >&2
            exit 1
          fi
          echo "Temporary debug keystore verified successfully."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected APK not found at: $EXPECTED_APK" >&2
            echo "Searching only within app/build/outputs/apk for discovered APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: $EXPECTED_APK is not a regular file." >&2
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: $EXPECTED_APK is empty (0 bytes)." >&2
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "ERROR: $EXPECTED_APK does not have the .apk extension." >&2
            exit 1
          fi

          echo "Selected APK verified successfully:"
          ls -lh "$EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RUNNER_TMP_DIR="${RUNNER_TEMP:-/tmp}/apk_release_asset"
          mkdir -p "$RUNNER_TMP_DIR"

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          # Sanitize repository name for safe filename usage
          CLEAN_REPO=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9._-]/-/g' -e 's/--*/-/g' -e 's/^-//' -e 's/-$//')
          if [ -z "$CLEAN_REPO" ]; then
            CLEAN_REPO="app"
          fi

          ASSET_FILENAME="${CLEAN_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_FULL_PATH="${RUNNER_TMP_DIR}/${ASSET_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_FULL_PATH"

          if [ ! -f "$ASSET_FULL_PATH" ] || [ ! -s "$ASSET_FULL_PATH" ]; then
            echo "ERROR: Prepared release asset is missing or empty at $ASSET_FULL_PATH" >&2
            exit 1
          fi

          echo "Prepared APK release asset: $ASSET_FULL_PATH"
          echo "asset_path=${ASSET_FULL_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== GitHub CLI Environment ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "ERROR: Release asset validation failed: '$ASSET_PATH'" >&2
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          cat << 'EOF' > /tmp/release_notes.md
          ### Automated Debug APK Build

          * **Build Type:** Automatically generated debug APK
          * **Builder:** GitHub Actions
          * **Run Number:** ${GITHUB_RUN_NUMBER}
          * **Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          * **Commit SHA:** `${GITHUB_SHA}`
          * **Notice:** This is an automatically generated debug APK intended for testing and development. It is not a Play Store production release and is signed only with a temporary debug keystore.
          EOF

          # Substitute environment variables into notes
          sed -i "s/\${GITHUB_RUN_NUMBER}/${GITHUB_RUN_NUMBER}/g" /tmp/release_notes.md
          sed -i "s/\${GITHUB_RUN_ATTEMPT}/${GITHUB_RUN_ATTEMPT}/g" /tmp/release_notes.md
          sed -i "s/\${GITHUB_SHA}/${GITHUB_SHA}/g" /tmp/release_notes.md

          echo "Publishing release '$RELEASE_TAG'..."
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file /tmp/release_notes.md \
            --latest

          echo "Release published successfully."
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_STATUS="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          echo "### Debug APK Build and Publishing Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "* **Debug APK Build:** Completed successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "* **GitHub Actions Artifact:** \`app-debug-apk\` (Preserved under Workflow Run artifacts)" >> "$GITHUB_STEP_SUMMARY"

          if [ "$RELEASE_STATUS" = "success" ]; then
            echo "=== GitHub Release Publishing Succeeded ==="
            gh release view "$RELEASE_TAG" || true

            REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            RELEASE_URL="${REPO_URL}/releases/tag/${RELEASE_TAG}"

            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${GITHUB_RUN_NUMBER}"
            echo "Direct Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "#### GitHub Release: Published" >> "$GITHUB_STEP_SUMMARY"
            echo "Direct Release Page: [$RELEASE_URL]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "You can download **\`${ASSET_NAME}\`** directly from the **Assets** section of the release page on your phone or computer." >> "$GITHUB_STEP_SUMMARY"
            echo "The standard GitHub Actions artifact **\`app-debug-apk\`** is also retained on this run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "=== WARNING: Release Publishing Failed or Was Skipped ==="
            echo "Outcome of release step: $RELEASE_STATUS"
            echo "The debug APK build succeeded and is safely preserved as a GitHub Actions artifact."
            echo "Artifact name: app-debug-apk"

            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "#### Notice: GitHub Release Publishing Did Not Complete" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK build completed successfully. The artifact **\`app-debug-apk\`** is available for download directly from the summary section of this workflow run." >> "$GITHUB_STEP_SUMMARY"
            echo "Ensure repository permissions grant **Read and write permissions** to GitHub Actions under **Settings > Actions > General > Workflow permissions** if you wish to publish to GitHub Releases." >> "$GITHUB_STEP_SUMMARY"
          fi
